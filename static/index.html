<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Processor - Tree View</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .container { margin-top: 50px; }
        .tree-item { border-bottom: 1px solid #e0e0e0; padding: 10px 0; }
        .tree-item-content { display: flex; justify-content: space-between; align-items: center; }
        .folder-name { display: flex; align-items: center; cursor: pointer; }
        .folder-name i { margin-right: 8px; color: #ffa000; }
        .indent { margin-left: 25px; border-left: 1px dashed #ccc; padding-left: 10px; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="row">
        <div class="col s12">
            <h4 class="blue-text text-darken-2">
                <i class="material-icons left" style="font-size: 40px;">folder_special</i>
                Media Explorer
            </h4>
        </div>
    </div>

    <div class="row">
        <div class="col s12">
            <div class="card white">
                <div class="card-content">
                    <span class="card-title">Directorios</span>
                    
                    <div v-if="loading" class="progress"><div class="indeterminate"></div></div>

                    <folder-item 
                        v-for="folder in directories" 
                        :key="folder.name" 
                        :node="folder" 
                        :parent-path="''"
                        :processing="processing"
                        @process="processFolder">
                    </folder-item>

                    <p v-if="!loading && directories.length === 0" class="grey-text">No se encontraron directorios.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script>
    const { createApp, ref, onMounted } = Vue;

    // Sub-componente para manejar la recursividad
    const FolderItem = {
        name: 'folder-item',
        props: ['node', 'parentPath', 'processing'],
        template: `
            <div class="tree-item">
                <div class="tree-item-content">
                    <span 
                        class="folder-name" 
                        :style="{ cursor: hasChildren ? 'pointer' : 'default' }"
                        @click="toggleExpand"
                    >                    
                        <i class="material-icons">{{ expanded || !hasChildren ? 'folder_open' : 'folder' }}</i>
                        <strong :class="textClass">{{ node.name }}</strong>
                    </span>
                    <button 
                        @click="$emit('process', fullPath)" 
                        class="btn-floating btn-small waves-effect waves-light blue"
                        :disabled="processing === fullPath">
                        <i class="material-icons">{{ processing === fullPath ? 'sync' : 'play_arrow' }}</i>
                    </button>
                </div>
                
                <div v-if="expanded && hasChildren" class="indent">
                    <folder-item 
                        v-for="child in node.children" 
                        :key="child.name" 
                        :node="child" 
                        :parent-path="fullPath"
                        :processing="processing"
                        @process="$emit('process', $event)">
                    </folder-item>
                </div>
            </div>
        `,
        data() {
            return { expanded: false };
        },
        computed: {
            hasChildren() {
                return this.node.children && this.node.children.length > 0;
            },            
            fullPath() {
                // Construye el path concatenando padre/hijo
                return this.parentPath ? `${this.parentPath}/${this.node.name}` : this.node.name;
            }
        },
        methods: {
            toggleExpand() {
                if (this.hasChildren) {
                    this.expanded = !this.expanded;
                }
            }
        }        
    };

    createApp({
        components: { FolderItem },
        setup() {
            const directories = ref([]);
            const loading = ref(false);
            const processing = ref(null);

            const fetchDirectories = async () => {
                loading.value = true;
                try {
                    const res = await fetch('/directories');
                    directories.value = await res.json();
                } catch (e) {
                    M.toast({html: 'Error cargando directorios', classes: 'red'});
                } finally {
                    loading.value = false;
                }
            };

            const processFolder = async (fullPath) => {
                processing.value = fullPath;
                
                try {
                    const response = await fetch('/copy_torrent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: "*",
                            name: fullPath.split('/').pop(), // Solo el nombre de la carpeta final
                            folder: fullPath // Enviamos el path completo "padre/hijo"
                        })
                    });

                    const data = await response.json();
                    if (response.ok) {
                        M.toast({html: `✅ Procesado con éxito`, classes: 'green'});
                    } else {
                        M.toast({html: `❌ Error: ${data.error || 'Desconocido'}`, classes: 'red'});
                    }
                } catch (e) {
                    M.toast({html: 'Error de conexión', classes: 'red'});
                } finally {
                    processing.value = null;
                }
            };

            onMounted(fetchDirectories);
            return { directories, loading, processing, processFolder };
        }
    }).mount('#app');
</script>

</body>
</html>
