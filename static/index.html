<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Processor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .container { margin-top: 50px; }
        .collection-item { display: flex; justify-content: space-between; align-items: center; }
        .loader { margin: 20px 0; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="row">
        <div class="col s12">
            <h4 class="blue-text text-darken-2">
                <i class="material-icons left" style="font-size: 40px;">folder_open</i>
                Media Directory
            </h4>
            <p>Selecciona un directorio para iniciar el procesamiento.</p>
        </div>
    </div>

    <div class="row">
        <div class="col s12">
            <ul class="collection with-header z-depth-1">
                <li class="collection-header"><h5>Directorios Disponibles</h5></li>
                
                <li v-if="loading" class="collection-item center-align">
                    <div class="progress"><div class="indeterminate"></div></div>
                </li>

                <li v-for="dir in directories" :key="dir" class="collection-item">
                    <span>{{ dir }}</span>
                    <button 
                        @click="processFolder(dir)" 
                        class="btn-floating btn-small waves-effect waves-light blue"
                        :disabled="processing === dir">
                        <i class="material-icons">{{ processing === dir ? 'sync' : 'play_arrow' }}</i>
                    </button>
                </li>

                <li v-if="!loading && directories.length === 0" class="collection-item grey-text">
                    No se encontraron directorios.
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const directories = ref([]);
            const loading = ref(false);
            const processing = ref(null);

            const fetchDirectories = async () => {
                loading.ref = true;
                try {
                    const res = await fetch('/directories');
                    directories.value = await res.json();
                } catch (e) {
                    M.toast({html: 'Error cargando directorios', classes: 'red'});
                } finally {
                    loading.value = false;
                }
            };

            const processFolder = async (folderName) => {
                processing.value = folderName;
                
                try {
                    const response = await fetch('/copy_torrent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: "*",
                            name: folderName,
                            folder: folderName // El backend espera el nombre relativo o ruta completa según tu config
                        })
                    });

                    const data = await response.json();

                    if (response.status === 201) {
                        M.toast({
                            html: `✅ ${data.message}. Procesados: ${data.processed.length}`, 
                            classes: 'green'
                        });
                    } else if (data.status === "error") {
                        M.toast({html: `❌ Error: ${data.message}`, classes: 'red'});
                    } else {
                        M.toast({html: `ℹ️ ${data.message}`, classes: 'orange'});
                    }
                } catch (e) {
                    M.toast({html: 'Error de conexión con el servidor', classes: 'red'});
                } finally {
                    processing.value = null;
                }
            };

            onMounted(fetchDirectories);

            return { directories, loading, processing, processFolder };
        }
    }).mount('#app');
</script>

</body>
</html>
